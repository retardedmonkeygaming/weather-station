<!DOCTYPE html>
<html>
<head>
    <title>LCD Designer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h2>LCD Page Designer</h2>
        <nav><a href="/" class="nav-link">Dashboard</a></nav>
    </header>
    <div class="container">
        <div class="card">
            <h3>Assign Widget to Physical Page</h3>
            <form action="/api/save-page" method="post">
                <label>Select LCD Page Number (1-6):</label>
                <select name="page_id">
                    <option value="1">Page 1 (Default: Clock)</option>
                    <option value="2">Page 2 (Default: Indoor)</option>
                    <option value="3">Page 3 (Default: Outdoor)</option>
                    <option value="4">Page 4 (Default: UV/Forecast)</option>
                    <option value="5">Page 5 (Default: AQI)</option>
                    <option value="6">Page 6 (Default: Moon)</option>
                </select>

                <label style="margin-top:15px; display:block;">Select Widget to Display:</label>
                <select name="widget_type">
                    <option value="widget_clock">Digital Clock</option>
                    <option value="widget_indoor">Indoor Climate</option>
                    <option value="widget_outdoor">Outdoor Weather</option>
                    <option value="widget_forecast">UV Index & Min/Max</option>
                    <option value="widget_aqi">Air Quality Index</option>
                    <option value="widget_moon">Moon Phase</option>
                    <option value="widget_pi">Pi System Stats</option>
                </select>
                <button type="submit" class="btn-blue" style="margin-top:20px;">Update Physical LCD</button>
            </form>
        </div>
        
        <div class="card">
            <h3>Live Preview</h3>
            <div class="lcd-box" id="preview-box">Loading...</div>
            <p style="font-size:12px; color:#666;">This preview updates in real-time as you change pages on the Pi.</p>
        </div>
    </div>
    <script>
        setInterval(async () => {
            const r = await fetch('/api/data');
            const d = await r.json();
            document.getElementById('preview-box').innerText = d.lcd_line1 + "\n" + d.lcd_line2;
        }, 1000);
    </script>
</body>
</html>
