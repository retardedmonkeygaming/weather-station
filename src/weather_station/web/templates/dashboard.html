<!DOCTYPE html>
<html>
<head>
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Weather Station Dashboard</h1>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/designer">UI Designer</a>
            <a href="/settings">Settings</a>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h3>Live LCD Preview</h3>
            <div class="lcd-container" id="lcd">Loading...</div>
        </div>
        <div class="card">
            <h3>System Status</h3>
            <div class="status-row"><span>DHT11 Sensor:</span> <span id="dht-status" class="badge">--</span></div>
            <div class="status-row"><span>WiFi:</span> <span id="wifi-status" class="badge">--</span></div>
            <hr>
            <p>Indoor: <strong id="in-temp">--</strong></p>
            <p>Outdoor: <strong id="out-temp">--</strong></p>
        </div>
    </div>
    <script>
        async function update() {
            const r = await fetch('/api/data');
            const d = await r.json();
            document.getElementById('lcd').innerText = d.lcd_line1 + "\n" + d.lcd_line2;
            document.getElementById('in-temp').innerText = d.indoor_temp + " / " + d.indoor_humid;
            document.getElementById('out-temp').innerText = d.outdoor_temp;
            
            const dht = document.getElementById('dht-status');
            dht.className = "badge " + (d.dht_status === "ONLINE" ? "online" : "offline");
            dht.innerText = d.dht_status;
        }
        setInterval(update, 1000);
    </script>
</body>
</html>
