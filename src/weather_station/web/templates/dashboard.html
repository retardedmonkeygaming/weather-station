<!DOCTYPE html>
<html>
<head>
    <title>Pi Weather Station</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1 style="margin:0; font-size: 22px;">Weather Station Dashboard</h1>
        <nav>
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/designer" class="nav-link">UI Designer</a>
            <a href="/settings" class="nav-link">Settings</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h3>Live LCD Preview</h3>
            <div class="lcd-box" id="lcd-screen">Line 1\nLine 2</div>
        </div>

        <div class="card">
            <h3>System Status</h3>
            <p>Indoor Sensor: <span id="dht-status" class="status-badge">Checking...</span></p>
            <p>WiFi Connection: <span id="wifi-status" class="status-badge">Checking...</span></p>
            <hr>
            <p>Indoor: <b id="in-temp">--</b></p>
            <p>Outdoor: <b id="out-temp">--</b></p>
        </div>
    </div>

    <script>
        async function refresh() {
            try {
                const r = await fetch('/api/data');
                const d = await r.json();
                document.getElementById('lcd-screen').innerText = d.lcd_line1 + "\n" + d.lcd_line2;
                document.getElementById('in-temp').innerText = d.indoor_temp + " / " + d.indoor_humid;
                document.getElementById('out-temp').innerText = d.outdoor_temp;
                
                const dht = document.getElementById('dht-status');
                dht.className = "status-badge " + (d.dht_status === "ONLINE" ? "online" : "error");
                dht.innerText = d.dht_status;
            } catch(e) {}
        }
        setInterval(refresh, 1000);
    </script>
</body>
</html>
