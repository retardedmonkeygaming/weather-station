<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Station Preferences</h1>
        <nav><a href="/">Back to Dashboard</a></nav>
    </header>
    <div class="container">
        <div class="card">
            <h3>Adjust Configuration</h3>
            <form action="/api/save-settings" method="post">
                <label>Temp Unit:</label>
                <select name="unit">
                    <option value="C">Celsius (°C)</option>
                    <option value="F">Fahrenheit (°F)</option>
                </select>
                <label>Buzzer Mode:</label>
                <select name="buzzer">
                    <option value="ALL">All Sounds</option>
                    <option value="ERR">Errors Only</option>
                    <option value="MUTE">Mute</option>
                </select>
                <label>Refresh Rate (Mins):</label>
                <input type="number" name="api_rate" value="10">
                <button type="submit">Save All Settings</button>
            </form>
        </div>
    </div>
</body>
</html>
