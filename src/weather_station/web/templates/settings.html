<!DOCTYPE html>
<html>
<head><title>Weather Station Settings</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
    <h1>System Settings & Calibration</h1>
    <div style="margin-bottom: 20px; background: #0288d1; padding: 12px 20px; border-radius: 8px;">
        <a href="/" style="margin-right: 20px; text-decoration: none; color: white; font-weight: bold;">Dashboard</a>
    </div>

    <div class="card">
        <h2>Device Preferences</h2>
        <form action="/update-settings" method="post">
            <div class="form-group"><label>Temperature Unit:</label>
                <select name="unit"><option value="C">Celsius</option><option value="F">Fahrenheit</option></select>
            </div>
            <div class="form-group"><label>Buzzer Mode:</label>
                <select name="buzzer"><option value="ALL">ALL</option><option value="ERR">ERR</option><option value="MUTE">MUTE</option></select>
            </div>
            <div class="form-group"><label>Screen Display:</label>
                <select name="screen"><option value="ON">ON</option><option value="OFF">OFF</option></select>
            </div>
            <div class="form-group"><label>Auto Scroll Interval:</label>
                <select name="auto_scroll"><option value="0">Disabled</option><option value="5">5s</option></select>
            </div>
            <div class="form-group"><label>Daily Alarm:</label>
                <select name="alarm_on"><option value="OFF">OFF</option><option value="ON">ON</option></select>
            </div>
            <div class="form-group"><label>Alarm Hour:</label><input type="number" name="alarm_hr" value="17"></div>
            <div class="form-group"><label>Alarm Minute:</label><input type="number" name="alarm_min" value="0"></div>
            <div class="form-group"><label>API Interval:</label><select name="api_rate"><option value="10">10m</option></select></div>
            <div class="form-group"><label>Log Interval:</label><select name="log_rate"><option value="15">15m</option></select></div>
            <input type="submit" value="Save Settings" style="background:#0288d1; color:white; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer;">
        </form>
    </div>
</body>
</html>
