<!DOCTYPE html>
<html>
<head><title>Settings</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
    <header><h1>System Settings & Calibration</h1><nav><a href="/">Dashboard</a></nav></header>
    <div class="container">
        <div class="card">
            <form action="/api/save-settings" method="post">
                <h3>Device Preferences</h3>
                <label>1. Temp Unit:</label>
                <select name="unit"><option value="C">Celsius</option><option value="F">Fahrenheit</option></select>
                
                <label>2. Buzzer Mode:</label>
                <select name="buzzer"><option value="ALL">ALL</option><option value="ERR">ERR Only</option><option value="MUTE">MUTE</option></select>
                
                <label>3. Screen Power:</label>
                <select name="screen"><option value="ON">ON</option><option value="OFF">OFF</option></select>

                <label>4. Auto Scroll:</label>
                <select name="auto_scroll"><option value="0">OFF</option><option value="3">3s</option><option value="5">5s</option><option value="10">10s</option></select>

                <label>5. Daily Alarm:</label>
                <select name="alarm_on"><option value="OFF">OFF</option><option value="ON">ON</option></select>

                <label>6 & 7. Alarm Time:</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" name="alarm_hr" value="17" style="width:70px;">
                    <input type="text" name="alarm_min" value="00" style="width:70px;">
                </div>

                <label>8. API Interval (Mins):</label>
                <select name="api_rate"><option value="5">5m</option><option value="10">10m</option><option value="15">15m</option></select>

                <label>9. Log Interval (Mins):</label>
                <select name="log_rate"><option value="5">5m</option><option value="15">15m</option><option value="30">30m</option></select>

                <button type="submit" style="margin-top:20px;">💾 Save All Settings</button>
            </form>
        </div>
    </div>
</body>
</html>
