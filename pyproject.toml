[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skycast-weather-station"
version = "3.0.0"
description = "Professional environmental monitoring system with LCD display, web dashboard, and Discord integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SkyCast Team", email = "skycast@example.com"}
]
keywords = ["weather", "raspberry-pi", "iot", "environmental", "monitoring", "lcd", "discord"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "discord.py>=2.3.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "geopy>=2.4.0",
    "numpy>=1.24.0",
    "rpi.gpio>=0.7.0; platform_machine == 'armv7l' or platform_machine == 'aarch64'",
    "gpiozero>=1.6.0; platform_machine == 'armv7l' or platform_machine == 'aarch64'",
    "w1thermsensor>=2.0.0",
    "RPLCD>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
skycast = "src.weather_station.main:main"
skycast-run = "src.weather_station.main:main"

[project.urls]
Homepage = "https://github.com/skycast/weather-station"
Documentation = "https://skycast.github.io/docs"
Repository = "https://github.com/skycast/weather-station"
Issues = "https://github.com/skycast/weather-station/issues"
Changelog = "https://github.com/skycast/weather-station/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src.weather_station*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/weather_station"

[tool.coverage.run]
source = ["src/weather_station"]
omit = ["*/tests/*", "*/__pycache__/*"]
