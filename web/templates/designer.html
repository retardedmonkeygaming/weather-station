{% extends "base.html" %}

{% block title %}UI Designer - Weather Station{% endblock %}

{% block content %}
<div style="display: flex; flex-wrap: wrap; gap: 30px;">
    <div class="card" style="flex: 1; min-width: 300px;">
        <h2>Page Configurator</h2>
        <label><strong>Select Page Number:</strong></label>
        <select id="pageSelect">
            <option value="1">Page 1</option>
            <option value="2">Page 2</option>
            <option value="3">Page 3</option>
            <option value="4">Page 4</option>
            <option value="5">Page 5</option>
        </select>

        <label style="margin-top: 15px; display: block;"><strong>Select Widget Layout:</strong></label>
        <select id="widgetSelect" onchange="updatePreview()">
            <option value="widget_indoor">Indoor Climate (Temp & Humid)</option>
            <option value="widget_outdoor">Outdoor Weather & Forecast</option>
            <option value="widget_aqi">Air Quality Index & PM</option>
            <option value="widget_pi">Pi System Stats (CPU / RAM)</option>
            <option value="widget_status">Hardware System Diagnostics</option>
        </select>

        <button onclick="savePage()">💾 Save Layout to LCD</button>
        <button class="btn-danger" onclick="deletePage()">🗑️ Reset Page to Default</button>
    </div>

    <div class="card" style="flex: 1; min-width: 300px;">
        <h2>Live Screen Preview</h2>
        <div class="lcd-preview">
            <div class="lcd-preview-line" id="prev-line1">In:24.5C -> H:45%</div>
            <div class="lcd-preview-line" id="prev-line2">State: Comfort</div>
        </div>
    </div>
</div>

<script>
    const widgetTemplates = {
        "widget_indoor": ["In:24.5C -> H:45%", "State: Comfort 😊"],
        "widget_outdoor": ["Out:31.2C  22%", "Fcst:  Clear"],
        "widget_aqi": ["AQI:42 (Good)", "P2.5:12 P10:25"],
        "widget_pi": ["CPU:45.2C 12.4%", "RAM:28.1%"],
        "widget_status": ["DHT:OK  WiFi:OK", "Station Active"]
    };

    function updatePreview() {
        const selected = document.getElementById("widgetSelect").value;
        const lines = widgetTemplates[selected] || ["Custom Layout", "Ready"];
        document.getElementById("prev-line1").innerText = lines[0];
        document.getElementById("prev-line2").innerText = lines[1];
    }

    async function savePage() {
        const pageId = document.getElementById("pageSelect").value;
        const widget = document.getElementById("widgetSelect").value;
        await fetch("/api/save-page", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ page_id: pageId, widget_type: widget })
        });
        alert("Page " + pageId + " saved!");
    }

    async function deletePage() {
        const pageId = document.getElementById("pageSelect").value;
        await fetch("/api/delete-page", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ page_id: pageId })
        });
        alert("Page " + pageId + " reset!");
    }
</script>
{% endblock %}
