{% extends "base.html" %}

{% block title %}Settings - Weather Station{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>System Settings</h2>
    <form method="POST" action="/settings">
        <label>Temperature Units:</label>
        <select name="temp_unit">
            <option value="C" {% if state.temp_unit == 'C' %}selected{% endif %}>Celsius (°C)</option>
            <option value="F" {% if state.temp_unit == 'F' %}selected{% endif %}>Fahrenheit (°F)</option>
        </select>

        <label style="margin-top: 15px; display: block;">Buzzer Alert Mode:</label>
        <select name="buzzer_mode">
            <option value="ALL" {% if state.buzzer_mode == 'ALL' %}selected{% endif %}>ALL (All Beeps Enabled)</option>
            <option value="ERR" {% if state.buzzer_mode == 'ERR' %}selected{% endif %}>ERR (Errors Only)</option>
            <option value="MUTE" {% if state.buzzer_mode == 'MUTE' %}selected{% endif %}>MUTE (Silent)</option>
        </select>

        <label style="margin-top: 15px; display: block;">Auto-Scroll Interval (seconds):</label>
        <input type="number" name="auto_scroll_speed" value="{{ state.auto_scroll_speed }}" min="1" max="30">

        <button type="submit" style="margin-top: 20px;">💾 Save Settings</button>
    </form>
</div>
{% endblock %}
